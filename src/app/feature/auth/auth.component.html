<div class="auth-container">
  <div class="auth-toggle">
    <button [class.active]="isLoginMode" (click)="toggleMode()">Вхід</button>
    <button [class.active]="!isLoginMode" (click)="toggleMode()">Реєстрація</button>
  </div>

  <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
    <div class="form-group" *ngIf="!isLoginMode">
      <input type="text" formControlName="firstname" placeholder="Ім'я" />
    </div>
    <div class="form-group" *ngIf="!isLoginMode">
      <input type="text" formControlName="secondname" placeholder="Прізвище" />
    </div>

    <div class="form-group">
      <input type="email" formControlName="email" placeholder="Email" />
    </div>

    <div class="form-group">
      <input
        [type]="isPasswordVisible ? 'text' : 'password'"
        formControlName="password"
        placeholder="Пароль"
      />
      <img
        src="assets/img/eye-{{ isPasswordVisible ? 'open' : 'closed' }}.png"
        alt="Toggle password visibility"
        (click)="togglePasswordVisibility()"
        class="password-eye-icon"
      />
    </div>

    <div class="form-group" *ngIf="!isLoginMode">
      <input
        [type]="isPasswordVisible ? 'text' : 'password'"
        formControlName="confirmPassword"
        placeholder="Підтвердіть пароль"
      />
      <img
        src="assets/img/eye-{{ isPasswordVisible ? 'open' : 'closed' }}.png"
        alt="Toggle password visibility"
        (click)="togglePasswordVisibility()"
        class="password-eye-icon"
      />
    </div>

    <div *ngIf="isLoginMode" class="forgot-password">
      <a href="#" (click)="onForgotPassword($event)">Забули пароль?</a>
    </div>

    <button type="submit" class="submit-button">
      {{ isLoginMode ? 'Увійти' : 'Зареєструватися' }}
    </button>
  </form>
</div>
