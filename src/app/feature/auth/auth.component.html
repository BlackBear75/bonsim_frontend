<div class="auth-container">
  <div class="auth-toggle">
    <button [class.active]="isLoginMode" (click)="toggleMode()">Вхід</button>
    <button [class.active]="!isLoginMode" (click)="toggleMode()">Реєстрація</button>
  </div>

  <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
    <div class="form-group" *ngIf="!isLoginMode">
      <input type="text" formControlName="firstname" placeholder="Ім'я" />
      <div class="error" *ngIf="authForm.get('firstname')?.touched && authForm.get('firstname')?.invalid">
        Ім’я є обов’язковим
      </div>
    </div>

    <!-- Прізвище -->
    <div class="form-group" *ngIf="!isLoginMode">
      <input type="text" formControlName="secondname" placeholder="Прізвище" />
      <div class="error" *ngIf="authForm.get('secondname')?.touched && authForm.get('secondname')?.invalid">
        Прізвище є обов’язковим
      </div>
    </div>

    <!-- Email -->
    <div class="form-group">
      <input type="email" formControlName="email" placeholder="Email" />
      <div class="error" *ngIf="authForm.get('email')?.touched && authForm.get('email')?.invalid">
        <span *ngIf="authForm.get('email')?.errors?.['required']">Email є обов’язковим</span>
        <span *ngIf="authForm.get('email')?.errors?.['email']">Неправильний формат email</span>
      </div>
    </div>

    <div class="form-group">
      <input
        [type]="isPasswordVisible ? 'text' : 'password'"
        formControlName="password"
        placeholder="Пароль"
        (input)="onPasswordChange()"
      />
      <img
        src="assets/img/eye-{{ isPasswordVisible ? 'open' : 'closed' }}.png"
        alt="Toggle password visibility"
        (click)="togglePasswordVisibility()"
        class="password-eye-icon"
      />
      <div class="error" *ngIf="authForm.get('password')?.touched && authForm.get('password')?.invalid">
        <span *ngIf="authForm.get('password')?.errors?.['required']">Пароль є обов’язковим</span>
      </div>
    </div>

    <!-- Правила пароля -->
    <div *ngIf="!isLoginMode && authForm.get('password')?.touched">
      <ul class="password-rules">
        <li [class.valid]="hasUpperCase()" [class.invalid]="!hasUpperCase()">
          Містить принаймні одну велику латинську літеру
        </li>
        <li [class.valid]="hasNumber()" [class.invalid]="!hasNumber()">
          Містить принаймні одну цифру
        </li>
        <li [class.valid]="passwordLength !== null && passwordLength >= 6" [class.invalid]="passwordLength === null || passwordLength < 6">
          Мінімальна довжина — 6 символів
        </li>

      </ul>
    </div>

    <div class="form-group" *ngIf="!isLoginMode">
      <input
        [type]="isPasswordVisible ? 'text' : 'password'"
        formControlName="confirmPassword"
        placeholder="Підтвердіть пароль"
      />
      <img
        src="assets/img/eye-{{ isPasswordVisible ? 'open' : 'closed' }}.png"
        alt="Toggle password visibility"
        (click)="togglePasswordVisibility()"
        class="password-eye-icon"
      />
      <div class="error" *ngIf="authForm.get('confirmPassword')?.touched && authForm.hasError('passwordMismatch')">
        Паролі не збігаються
      </div>
    </div>

    <div *ngIf="isLoginMode" class="forgot-password">
      <a href="#" (click)="onForgotPassword($event)">Забули пароль?</a>
    </div>

    <button type="submit" class="submit-button" [disabled]="authForm.invalid">
      {{ isLoginMode ? 'Увійти' : 'Зареєструватися' }}
    </button>
  </form>
</div>
