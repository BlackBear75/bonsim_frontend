<footer class="bonsim-footer bg-dark">
  <div class="container">
    <div class="row d-flex align-items-center justify-content-between py-4">

      <!-- Лого -->
      <div class="col-md-4 text-start">
        <h2 class="h2 text-white logo">BONSIM</h2>
      </div>

      <!-- Посилання -->
      <div class="col-md-8 text-end">
        <ul class="list-inline mb-0 footer-link-list">
          <li class="list-inline-item mx-3">
            <a
              class="text-decoration-none"
              routerLink="/about"
              routerLinkActive="active-footer-link"
              [routerLinkActiveOptions]="{ exact: true }"
            >Зв’язок з нами</a>
          </li>
          <li class="list-inline-item mx-3">
            <a
              class="text-decoration-none"
              routerLink="/shipping"
              routerLinkActive="active-footer-link"
              [routerLinkActiveOptions]="{ exact: true }"
            >Доставка</a>
          </li>
          <li class="list-inline-item mx-3">
            <a
              class="text-decoration-none"
              routerLink="/size-chart"
              routerLinkActive="active-footer-link"
              [routerLinkActiveOptions]="{ exact: true }"
            >Розмірна сітка</a>
          </li>
        </ul>
      </div>

    </div>
  </div>
</footer>
