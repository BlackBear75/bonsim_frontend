<div class="size-chart-table">
  <div *ngIf="imageUrl">
    <img ngSrc="imageUrl" alt="Size chart" class="size-chart-image" />
  </div>

  <div class="recommendations">
    <p>✅ Краще беріть той розмір, який ви завжди носите.</p>
    <p>📏 Потрібно заміряти по одягу.</p>
    <p>❓ Якщо не можете визначитись з розміром — ми можемо підказати вам по зріст/вага.</p>
  </div>

  <table mat-table [dataSource]="tableData" class="mat-elevation-z1">

    <ng-container matColumnDef="size">
      <th mat-header-cell *matHeaderCellDef> Розмір </th>
      <td mat-cell *matCellDef="let element"> {{element.size}} </td>
    </ng-container>

    <ng-container matColumnDef="chest">
      <th mat-header-cell *matHeaderCellDef> Пів обхват грудей </th>
      <td mat-cell *matCellDef="let element"> {{element.chest}} </td>
    </ng-container>

    <ng-container matColumnDef="length">
      <th mat-header-cell *matHeaderCellDef> Довжина </th>
      <td mat-cell *matCellDef="let element"> {{element.length}} </td>
    </ng-container>

    <ng-container matColumnDef="sleeve">
      <th mat-header-cell *matHeaderCellDef> Довжина рукава </th>
      <td mat-cell *matCellDef="let element"> {{element.sleeve}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
